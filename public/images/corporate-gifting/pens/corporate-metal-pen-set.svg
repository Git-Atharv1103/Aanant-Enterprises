<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="penGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#B78103"/>
    </linearGradient>
    <linearGradient id="penBlack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="clipChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#bgAura)"/>

  <!-- Presentation Case Bed -->
  <g filter="url(#shadow)">
    <rect x="110" y="160" width="380" height="280" rx="24" fill="#0D1322" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="126" y="176" width="348" height="248" rx="18" fill="#070A12" stroke="rgba(255,181,71,0.25)" stroke-width="1"/>
    <line x1="150" y1="300" x2="450" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="60" stroke-linecap="round"/>
  </g>

  <!-- Pen 1: Executive Matte Black with Gold Laser Monogram -->
  <g transform="rotate(-28 300 300) translate(0, -25)" filter="url(#shadow)">
    <rect x="170" y="285" width="240" height="22" rx="6" fill="url(#penBlack)" stroke="url(#penGold)" stroke-width="1"/>
    <polygon points="410,286 450,296 410,306" fill="url(#penGold)"/>
    <path d="M445,296 L458,296" stroke="#FFE082" stroke-width="1"/>
    <rect x="230" y="284" width="12" height="24" rx="1" fill="url(#penGold)"/>
    <rect x="175" y="282" width="65" height="5" rx="2.5" fill="url(#clipChrome)"/>
    <circle cx="238" cy="284" r="3" fill="url(#penGold)"/>
    <text x="280" y="299" font-family="monospace" font-size="7" fill="#FFE082" letter-spacing="2" opacity="0.9">AANANT</text>
  </g>

  <!-- Pen 2: Executive Brushed Gold Stylus Twist Pen -->
  <g transform="rotate(-28 300 300) translate(0, 35)" filter="url(#shadow)">
    <rect x="170" y="287" width="240" height="18" rx="5" fill="url(#penGold)"/>
    <polygon points="410,288 446,296 410,304" fill="url(#penBlack)"/>
    <rect x="280" y="286" width="8" height="20" rx="1" fill="url(#penBlack)"/>
    <rect x="175" y="284" width="60" height="4.5" rx="2" fill="url(#clipChrome)"/>
  </g>

  <!-- Golden Laser Sparkle Accent -->
  <circle cx="395" cy="225" r="3" fill="#FFFFFF"/>
  <line x1="395" y1="215" x2="395" y2="235" stroke="#FFB547" stroke-width="1.5" opacity="0.8"/>
  <line x1="385" y1="225" x2="405" y2="225" stroke="#FFB547" stroke-width="1.5" opacity="0.8"/>
</svg>