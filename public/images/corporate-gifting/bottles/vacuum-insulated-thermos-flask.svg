<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bottleAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3478F6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="25%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="silverAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="goldLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="bottleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#bottleAura)"/>

  <!-- Bottle Body -->
  <g filter="url(#bottleShadow)">
    <!-- Base shadow oval -->
    <ellipse cx="300" cy="510" rx="90" ry="16" fill="#000000" opacity="0.6"/>

    <!-- Main Cylinder -->
    <rect x="235" y="190" width="130" height="310" rx="30" fill="url(#metalBody)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Stainless steel ring shoulder -->
    <rect x="245" y="165" width="110" height="28" rx="6" fill="url(#silverAccent)"/>

    <!-- Smart LED Temperature Cap -->
    <rect x="248" y="115" width="104" height="52" rx="14" fill="#070A12" stroke="url(#silverAccent)" stroke-width="1.5"/>
    <circle cx="300" cy="140" r="14" fill="#00E5FF" opacity="0.15"/>
    <circle cx="300" cy="140" r="10" fill="#000000"/>
    <text x="300" y="143" font-family="sans-serif" font-size="8" font-weight="bold" fill="#00E5FF" text-anchor="middle">54°C</text>

    <!-- Laser Engraved Logo Specimen -->
    <g transform="translate(300, 330)">
      <circle cx="0" cy="-20" r="14" fill="none" stroke="url(#goldLaser)" stroke-width="1.5"/>
      <text x="0" y="-16" font-family="monospace" font-size="11" font-weight="bold" fill="url(#goldLaser)" text-anchor="middle">A</text>
      <text x="0" y="12" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="4" fill="url(#goldLaser)" text-anchor="middle">AANANT</text>
      <text x="0" y="26" font-family="monospace" font-size="7" letter-spacing="1.5" fill="#94A3B8" text-anchor="middle">VACUUM INSULATED</text>
    </g>

    <!-- Highlight Reflection Beam -->
    <path d="M260,195 L270,195 L270,490 L260,490 Z" fill="#FFFFFF" opacity="0.08"/>
  </g>
</svg>